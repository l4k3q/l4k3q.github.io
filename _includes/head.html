<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<link href="https://fonts.googleapis.com/css?family=Nunito+Sans:400,400i,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="icon" type="image/png" href="{{ '/assets/favicon.png' | relative_url }}">
<!-- 访问量统计：https://l4k3q.goatcounter.com （GoatCounter，免费无 Cookie） -->
<script data-goatcounter="https://l4k3q.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
