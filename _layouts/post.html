---
layout: default
---
<article class="post">
	<header class="post-header">
		<h1 class="post-title">{{ page.title | escape }}</h1>
		<div class="post-meta">
			<span class="post-date">{{ page.date | date: "%b %-d, %Y" }}</span>
			{% for tag in page.tags %}<a class="tag" href="{{ '/tags/#' | append: tag | relative_url }}">{{ tag | escape }}</a>{% endfor %}
		</div>
	</header>

	<div class="post-content">
		{{ content }}
	</div>

	<nav class="post-nav">
		{% if page.previous.url %}<a class="prev" href="{{ page.previous.url | relative_url }}">&larr; {{ page.previous.title | escape }}</a>{% endif %}
		{% if page.next.url %}<a class="next" href="{{ page.next.url | relative_url }}">{{ page.next.title | escape }} &rarr;</a>{% endif %}
	</nav>
</article>
